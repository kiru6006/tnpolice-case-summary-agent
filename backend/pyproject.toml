[project]
name = "vetri-backend"
version = "0.1.0"
description = "Vetri (வெற்றி) — Police Cases Report Agent Backend (FastAPI + LangGraph + pgvector)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Kirubakaran Srinivasan", email = "Kiru.Srini6006@gmail.com"}]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "langgraph>=0.2.50",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "llama-index>=0.11.0",
    "pgvector>=0.3.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.9",
    "boto3>=1.35.0",
    "aiofiles>=24.1.0",
    "python-multipart>=0.0.12",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "structlog>=24.4.0",
    "mcp>=1.0.0",
    "pillow>=11.0.0",
    "pypdf>=5.0.0",
    "pdf2image>=1.17.0",
    "pytesseract>=0.3.13"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "httpx>=0.27.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
