version: '3.8'

services:
  # PostgreSQL with pgvector extension for legal RAG embeddings & relational metadata
  db:
    image: pgvector/pgvector:pg16
    container_name: vetri-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vetri_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vetri_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-vetri_cases_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vetri_user} -d ${POSTGRES_DB:-vetri_cases_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for session checkpointer & caching
  redis:
    image: redis:7-alpine
    container_name: vetri-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO for local S3-compatible document storage
  minio:
    image: minio/minio:latest
    container_name: vetri-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vetri_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vetri_minio_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
